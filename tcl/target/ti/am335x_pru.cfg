#
# Texas Instruments AM335x with ARM Cortex-A8 + PRU-ICSS (PRU0 & PRU1)
#

source [find target/ti/am335x.cfg]

#
# AM335x PRU0 (Real-Time I/O Processor 0)
#
set _PRU0_TARGET $_CHIPNAME.pru0
target create $_PRU0_TARGET ti_pru -dap $_CHIPNAME.dap -ap-num 0 -base-addr 0x4a322000 -iram-addr 0x4a334000 -dram-addr 0x4a300000

#
# AM335x PRU1 (Real-Time I/O Processor 1)
#
set _PRU1_TARGET $_CHIPNAME.pru1
target create $_PRU1_TARGET ti_pru -dap $_CHIPNAME.dap -ap-num 0 -base-addr 0x4a324000 -iram-addr 0x4a338000 -dram-addr 0x4a302000
